      </span>

        <span data-language="en" lang="en">Open</span>

<script>
(function () {
  const preview = document.getElementById('cv-preview');
  const heading = document.getElementById('cv-preview-heading');
  const openLink = document.getElementById('cv-preview-open');
  const buttons = Array.from(document.querySelectorAll('[data-cv-language]'));
  if (!preview || !heading || !openLink || buttons.length === 0) return;

  const versions = {
    en: {
      url: '/assets/pdf/CV_Xiaofeng_Tan.pdf',
      heading: 'English CV',
      aria: 'English CV'
    },
    zh: {
      url: '/assets/pdf/CV_Xiaofeng_Tan_CN.pdf',
      heading: '中文简历',
      aria: '中文简历'
    }
  };

  let active = document.documentElement.lang === 'zh-CN' ? 'zh' : 'en';

  function render() {
    const version = versions[active];
    preview.setAttribute('data', version.url);
    preview.setAttribute('aria-label', version.aria);
    heading.textContent = version.heading;
    openLink.setAttribute('href', version.url);
    buttons.forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.cvLanguage === active));
    });
  }

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      active = button.dataset.cvLanguage;
      render();
    });
  });

  document.addEventListener('site-language-changed', function (event) {
    active = event.detail && event.detail.language === 'zh' ? 'zh' : 'en';
    render();
  });

  render();
})();
</script>
